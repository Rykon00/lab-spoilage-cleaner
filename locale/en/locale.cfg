[mod-name]
lab-spoilage-cleaner=Lab Spoilage Cleaner

[mod-description]
lab-spoilage-cleaner=Takes spoilage and other unusable items out of labs. Construction robots carry it to storage chests (or it goes straight into the logistic network). Labs on space platforms empty into the hub.

[mod-setting-name]
lsc-mode=Where spoilage from labs goes
lsc-interval=Check interval (seconds)
lsc-platform-hub=Space platforms: put spoilage into the hub

[mod-setting-description]
lsc-mode=Robots: the items are dropped next to the lab and marked for deconstruction, construction robots carry them to a storage chest (only for labs inside a construction area). Logistic network: the items go directly into the logistic network the lab stands in.
lsc-interval=How often each lab is checked. The labs are spread over the ticks of the interval.
lsc-platform-hub=Labs on space platforms (no robots there) put their spoilage into the platform hub.

[string-mod-setting]
lsc-mode-robots=Robots pick it up
lsc-mode-network=Directly into the logistic network

[lsc]
command-help=Removes spoilage from all labs right now.
cleaned=Lab Spoilage Cleaner: removed __1__ items from labs.
