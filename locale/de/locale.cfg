[mod-name]
lab-spoilage-cleaner=Lab Spoilage Cleaner

[mod-description]
lab-spoilage-cleaner=Holt Verdorbenes und andere unbrauchbare Gegenstände aus Laboren. Baudrohnen bringen es in Lagerkisten (oder es geht direkt ins Logistiknetz). Labore auf Raumplattformen leeren in den Hub.

[mod-setting-name]
lsc-mode=Wohin Verdorbenes aus Laboren geht
lsc-interval=Prüfintervall (Sekunden)
lsc-platform-hub=Raumplattformen: Verdorbenes in den Hub

[mod-setting-description]
lsc-mode=Drohnen: Die Gegenstände werden neben dem Labor abgelegt und zum Abbau markiert, Baudrohnen bringen sie in eine Lagerkiste (nur für Labore im Baubereich). Logistiknetz: Die Gegenstände gehen direkt in das Logistiknetz, in dem das Labor steht.
lsc-interval=Wie oft jedes Labor geprüft wird. Die Labore werden über die Ticks des Intervalls verteilt.
lsc-platform-hub=Labore auf Raumplattformen (dort gibt es keine Drohnen) legen Verdorbenes in den Plattform-Hub.

[string-mod-setting]
lsc-mode-robots=Drohnen holen es ab
lsc-mode-network=Direkt ins Logistiknetz

[lsc]
command-help=Entfernt sofort Verdorbenes aus allen Laboren.
cleaned=Lab Spoilage Cleaner: __1__ Gegenstände aus Laboren entfernt.
